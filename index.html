<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MY TASKS</title>
<style>
:root{--bg:#000;--s1:#080d17;--s2:#0f1726;--bd:#1a2640;--tx:#dce8ff;--mu:#6f84a8;--ac:#2f8bff;--ok:#27e08a;--wa:#ffb020;--er:#ff4d6d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding-bottom:90px;background-image:radial-gradient(ellipse at top,#0b1c3a 0,#000 60%)}
#r{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;letter-spacing:3px;margin:0;color:var(--ac);text-shadow:0 0 14px #2f8bff66}
h3{margin:18px 0 8px;font-size:13px;letter-spacing:2px;color:var(--mu);text-transform:uppercase}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sub{color:var(--mu);font-size:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fd .2s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{max-height:92vh;overflow:auto;background:var(--s2);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:640px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
input,select,textarea{width:100%;resize:none;background:#000;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit;margin-bottom:10px;outline:none}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;animation:up .3s ease both;transition:.2s}
.row.done .ti{text-decoration:line-through;color:var(--mu)}
.row.miss{border-color:#ff4d6d77}
.grow{flex:1;min-width:0;cursor:pointer}
.ti{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--mu)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);background:transparent;color:#000;font-weight:900;cursor:pointer;flex:none;transition:.2s}
.chk.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px #27e08a77}
.chk.av{border-color:var(--ok)}
.chk.bad{background:var(--er);border-color:var(--er);box-shadow:0 0 12px #ff4d6d77}
.x{background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer;padding:6px}
.x:hover{color:var(--er)}
.bar{height:8px;background:#0b1424;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .6s ease}

.nav button b{display:block;font-size:18px}
.nav button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 0 22px #2f8bffaa;cursor:pointer;z-index:25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--s1);border:1px solid var(--bd);cursor:pointer}
.cal .h{background:none;border:0;color:var(--mu);aspect-ratio:auto;cursor:default}
.cal .sel{outline:2px solid var(--ac)}
.cal .td{border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:26px 0}
.ring{display:flex;align-items:center;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.two .card svg{width:88px;height:88px}
</style></head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {createElement:h,useState,useEffect}=React;
/* Storage adapter: swap this object for an API/cloud (Supabase etc.) adapter later. data.user is reserved for auth. */
const Store={key:'mytasks.v1',load(){try{return JSON.parse(localStorage.getItem(this.key))}catch(e){return null}},save(d){try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){}}};
const CATS=['Work','Study','Health','Personal','Finance'],PRI=['High','Medium','Low'],REP=[['once','Once'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];
const PC={High:'var(--er)',Medium:'var(--wa)',Low:'var(--ok)'};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=k=>new Date(k+'T00:00:00');
const addDays=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const occurs=(t,k)=>{if(k<t.date)return false;if(t.end&&k>t.end)return false;if(t.rep==='once')return k===t.date;if(t.rep==='daily')return true;if(t.rep==='weekly')return pd(k).getDay()===pd(t.date).getDay();return pd(k).getDate()===pd(t.date).getDate()};
const forDay=(tasks,k)=>tasks.filter(t=>occurs(t,k)).sort((a,b)=>PRI.indexOf(a.pri)-PRI.indexOf(b.pri));
const NS={notes:{},from:'9999-99-99'};
const hasNote=k=>(NS.notes[k]||[]).length>0;
/* Daily note is a fixed task: from notesFrom up to today, each day counts one extra item that is done only if at least 1 note exists */

function Row({t,k,toggle,edit,del,chk=true,miss=false}){

    chk&&h('button',{className:'chk'+(av?(on?' bad':' av'):(on?' on':'')),onClick:()=>toggle(t.id,k),'aria-label':'toggle'},on?(av?'✕':'✓'):''),

}

function MonthCard({tasks,today}){
  const C=2*Math.PI*46,t=pd(today),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  let sum=0,act=0,n=0,d=0;
  for(let i=1;i<=t.getDate();i++){const s=stat(tasks,t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(i));if(s.n){sum+=s.d/s.n*100;act++;n+=s.n;d+=s.d}}
  const p=Math.round(sum/dim*100)/100;
  return h('div',{className:'card ring'},
    h('svg',{width:110,height:110,viewBox:'0 0 110 110'},
      h('circle',{cx:55,cy:55,r:46,fill:'none',stroke:'#0f1a2e',strokeWidth:9}),
      h('circle',{cx:55,cy:55,r:46,fill:'none',stroke:'var(--ok)',strokeWidth:9,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:C*(1-p/100),transform:'rotate(-90 55 55)',style:{transition:'stroke-dashoffset .7s ease',filter:'drop-shadow(0 0 5px #27e08a)'}}),

    h('div',null,h('div',{className:'sub'},'THIS MONTH'),h('div',{style:{fontSize:18,fontWeight:700}},d+' / '+n+' done'),h('div',{className:'sub'},'daily % total ÷ '+dim+' days')));
}

function Today({tasks,today,toggle,edit,add}){
  const [q,setQ]=useState('');
  const s=stat(tasks,today),C=2*Math.PI*46;
  const go=()=>{if(q.trim()){add({id:uid(),title:q.trim(),cat:'Personal',pri:'Medium',rep:'once',date:today,done:{}});setQ('')}};
  const l=forDay(tasks,today);
  return h('div',null,
    h('div',{className:'two'},
    h('div',{className:'card ring'},
      h('svg',{width:110,height:110,viewBox:'0 0 110 110'},
        h('circle',{cx:55,cy:55,r:46,fill:'none',stroke:'#0f1a2e',strokeWidth:9}),
        h('circle',{cx:55,cy:55,r:46,fill:'none',stroke:'var(--ac)',strokeWidth:9,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:C*(1-s.p/100),transform:'rotate(-90 55 55)',style:{transition:'stroke-dashoffset .7s ease',filter:'drop-shadow(0 0 5px #2f8bff)'}}),
        h('text',{x:55,y:61,textAnchor:'middle',fill:'var(--tx)',fontSize:22,fontWeight:700},s.p+'%')),
      h('div',null,h('div',{className:'sub'},'TODAY'),h('div',{style:{fontSize:18,fontWeight:700}},s.d+' / '+s.n+' done'),h('div',{className:'sub'},s.n?(s.p===100?'All clear. Great work.':(s.n-s.d)+' remaining'+(hasNote(today)?'':' · incl. daily note')):'No tasks scheduled today'))),

    h('h3',null,'Today'),
    l.length?l.map(t=>h(Row,{key:t.id,t,k:today,toggle,edit})):h('div',{className:'empty'},'Nothing planned. Add a task below.'));

function Tasks({tasks,today,edit,del}){
  const [q,setQ]=useState(''),[c,setC]=useState(''),[p,setP]=useState('');
  const l=tasks.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())&&(!c||t.cat===c)&&(!p||t.pri===p)).sort((a,b)=>(a.end&&a.end<today?1:0)-(b.end&&b.end<today?1:0));

    h('div',{className:'g2'},h('select',{value:c,onChange:e=>setC(e.target.value)},opt(CATS,'All categories')),h('select',{value:p,onChange:e=>setP(e.target.value)},opt(PRI,'All priorities'))),

function Goals({goals,setGoals}){
  const [t,setT]=useState(''),[n,setN]=useState('10');
  const add=()=>{if(t.trim()){setGoals(g=>[...g,{id:uid(),title:t.trim(),target:Math.max(1,+n||1),cur:0}]);setT('')}};
  const upd=(id,d)=>setGoals(g=>g.map(x=>x.id===id?{...x,cur:Math.max(0,Math.min(x.target,x.cur+d))}:x));
  return h('div',null,
    h('div',{className:'g2',style:{gridTemplateColumns:'1fr 80px auto'}},h('input',{placeholder:'New goal',value:t,onChange:e=>setT(e.target.value)}),h('input',{type:'number',min:1,value:n,onChange:e=>setN(e.target.value)}),h('button',{className:'btn',style:{marginBottom:10},onClick:add},'Add')),
    goals.length?goals.map(g=>h('div',{key:g.id,className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:8}},h('b',null,g.title),h('button',{className:'x',onClick:()=>setGoals(a=>a.filter(x=>x.id!==g.id))},'✕')),
      h('div',{className:'bar'},h('i',{style:{width:g.cur/g.target*100+'%'}})),
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10}},h('span',{className:'sub'},g.cur+' / '+g.target+' ('+Math.round(g.cur/g.target*100)+'%)'),
        h('span',null,h('button',{className:'btn g',onClick:()=>upd(g.id,-1)},'−'),' ',h('button',{className:'btn',onClick:()=>upd(g.id,1)},'+'))))):h('div',{className:'empty'},'Set your first goal'));
}

function Notes({d,setD,today}){
  const [q,setQ]=useState(()=>{try{return localStorage.getItem('mytasks.draft')||''}catch(e){return ''}});
  const [ed,setEd]=useState(null),[on,setOn]=useState(''),[pick,setPick]=useState(false),[flt,setFlt]=useState(''),[warn,setWarn]=useState(false);
  const notes=d.notes||{},ok=hasNote(today),cats=d.ncats||[];
  const draft=v=>{setQ(v);try{localStorage.setItem('mytasks.draft',v)}catch(e){}};
  const clear=()=>{setQ('');setEd(null);setPick(false);setWarn(false);try{localStorage.removeItem('mytasks.draft')}catch(e){}};

    if(ed)setD(x=>({...x,notes:{...x.notes,[ed.k]:(x.notes[ed.k]||[]).map(n=>n.id===ed.id?{...n,text:v,cat:c}:n)}}));
    else setD(x=>({...x,notes:{...x.notes,[today]:[...((x.notes||{})[today]||[]),{id:uid(),text:v,cat:c,at:new Date().toTimeString().slice(0,5)}]}}));

  const col=ok?'var(--ok)':'var(--er)';
  const chip=(label,act,onTap,onX)=>h('span',{key:label,style:{display:'inline-flex',alignItems:'center',border:'1px solid '+(act?'var(--ac)':'var(--bd)'),background:act?'#2f8bff22':'transparent',borderRadius:20,padding:'6px 12px'}},h('span',{onClick:onTap,style:{cursor:'pointer'}},label),onX&&h('span',{className:'x',style:{padding:'0 0 0 10px',fontSize:12},onClick:onX},'✕'));
  return h('div',null,
    h('div',{className:'card',style:{borderColor:col}},h('b',{style:{color:col}},ok?'✓ Daily note done':'⚠ Daily note required'),h('div',{className:'sub'},ok?'Today note is counted in your daily %.':'Write at least 1 note today, otherwise your daily % is reduced.')),
    h('div',{className:'card'},h('div',{className:'sub',style:{marginBottom:8}},'NOTE FILTERS (made by you)'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}},chip('All',!flt,()=>setFlt('')),cats.map(c=>chip(c.name,flt===c.name,()=>setFlt(flt===c.name?'':c.name),()=>delCat(c.id)))),
      h('div',{className:'g2',style:{gridTemplateColumns:'1fr auto'}},h('input',{placeholder:'New filter (e.g. Story, Personal)',value:on,onChange:e=>setOn(e.target.value),onKeyDown:e=>e.key==='Enter'&&addCat(false)}),h('button',{className:'btn',style:{marginBottom:10},onClick:()=>addCat(false)},'Add'))),
    ed&&h('div',{className:'sub',style:{marginBottom:6,color:'var(--wa)'}},'Editing a saved note \u00b7 ',h('span',{style:{textDecoration:'underline',cursor:'pointer'},onClick:clear},'Cancel edit')),
    warn&&h('div',{className:'sub',style:{marginBottom:6,color:'var(--wa)'}},'You have an unsaved draft. Save it first, or tap the note again to replace the draft.'),
    h('textarea',{rows:6,placeholder:'Write your note... (draft is kept automatically)',value:q,onChange:e=>draft(e.target.value)}),
    h('button',{className:'btn',style:{width:'100%',marginBottom:10},onClick:()=>q.trim()&&setPick(true)},ed?'Update note':'Save note'),
    pick&&h('div',{className:'ov',onClick:()=>setPick(false)},h('div',{className:'sheet',onClick:e=>e.stopPropagation()},
      h('h3',{style:{marginTop:0}},'Which filter is this note under?'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}},
        cats.map(c=>h('span',{key:c.id,style:{display:'inline-flex',alignItems:'center',border:'1px solid var(--ac)',borderRadius:20,padding:'8px 12px',background:'#2f8bff22',cursor:'pointer'},onClick:()=>save(c.name)},c.name)),
        h('span',{onClick:()=>save(''),style:{border:'1px solid var(--bd)',borderRadius:20,padding:'8px 12px',color:'var(--mu)',cursor:'pointer'}},'No filter')),
      h('div',{className:'g2',style:{gridTemplateColumns:'1fr auto'}},h('input',{placeholder:'Add new filter and save',value:on,onChange:e=>setOn(e.target.value),onKeyDown:e=>e.key==='Enter'&&addCat(true)}),h('button',{className:'btn',style:{marginBottom:10},onClick:()=>addCat(true)},'Add & save')),
      h('button',{className:'btn g',style:{width:'100%'},onClick:()=>setPick(false)},'Cancel'))),
    days.map(k=>h('div',{key:k},h('h3',null,k+(k===today?' \u00b7 today':'')),

}

function Stats({tasks,today}){
  const days=[0,1,2,3,4,5,6].map(i=>{const k=addDays(today,i-6);return{k,...stat(tasks,k)}});
  const avg=Math.round(days.reduce((a,d)=>a+d.p,0)/7);
  let k=today,s=0;const full=x=>{const v=stat(tasks,x);return v.n>0&&v.p===100};
  if(!full(k))k=addDays(k,-1);
  while(full(k)&&s<365){s++;k=addDays(k,-1)}
  const cats=CATS.map(c=>{let n=0,d=0;for(let i=0;i<30;i++){const kk=addDays(today,-i);tasks.filter(t=>t.cat===c&&occurs(t,kk)).forEach(t=>{n++;if(isDone(t,kk))d++})}return{c,n,p:n?Math.round(d/n*100):0}});
  return h('div',null,
    h('div',{className:'g2'},h('div',{className:'card'},h('div',{className:'sub'},'7-DAY AVG'),h('div',{style:{fontSize:26,color:'var(--ac)'}},avg+'%')),h('div',{className:'card'},h('div',{className:'sub'},'STREAK'),h('div',{style:{fontSize:26,color:'var(--ok)'}},s+' days'))),
    h('h3',null,'Last 7 days'),
    h('div',{className:'card'},h('svg',{viewBox:'0 0 300 130',width:'100%'},days.map((d,i)=>{const x=i*42+8,ht=d.p*0.85;return h('g',{key:d.k},
      h('rect',{x,y:100-ht,width:28,height:Math.max(ht,2),rx:5,fill:d.p===100?'var(--ok)':'var(--ac)',style:{transition:'.6s'}}),
      h('text',{x:x+14,y:94-ht,textAnchor:'middle',fill:'var(--mu)',fontSize:9},d.p+'%'),
      h('text',{x:x+14,y:118,textAnchor:'middle',fill:'var(--mu)',fontSize:10},'SMTWTFS'[pd(d.k).getDay()]))}))),
    h('h3',null,'Categories (30 days)'),
    h('div',{className:'card'},cats.map(c=>h('div',{key:c.c,style:{marginBottom:10}},h('div',{className:'meta',style:{display:'flex',justifyContent:'space-between'}},h('span',null,c.c),h('span',null,c.n?c.p+'%':'-')),h('div',{className:'bar'},h('i',{style:{width:c.p+'%'}}))))));
}

function Report({tasks,today}){
  const t=pd(today);
  let first=NS.from<'9999'?NS.from:today;
  tasks.forEach(x=>{if(x.date<first)first=x.date});
  const f=pd(first),rows=[];
  for(let y=t.getFullYear(),m=t.getMonth();y>f.getFullYear()||(y===f.getFullYear()&&m>=f.getMonth());){
    const dim=new Date(y,m+1,0).getDate();let sum=0,miss=0;
    for(let i=1;i<=dim;i++){const k=y+'-'+pad(m+1)+'-'+pad(i);if(k>today)break;const s=stat(tasks,k);if(s.n){sum+=s.d/s.n*100;if(s.p<100)miss++}}
    rows.push({y,m,p:Math.round(sum/dim*100)/100,miss});
    m--;if(m<0){m=11;y--}
  }
  return h('div',null,h('h3',null,'Monthly report'),h('div',{className:'card'},rows.map(r=>h('div',{key:r.y+'-'+r.m,style:{marginBottom:12}},h('div',{className:'meta',style:{display:'flex',justifyContent:'space-between',marginBottom:4}},h('span',null,new Date(r.y,r.m,1).toLocaleString('en',{month:'long',year:'numeric'})),h('span',null,r.p+'% · '+r.miss+' days incomplete')),h('div',{className:'bar'},h('i',{style:{width:r.p+'%'}}))))));
}

function Calendar({tasks,today,toggle,edit}){
  const [m,setM]=useState(()=>{const d=pd(today);d.setDate(1);return d});
  const [sel,setSel]=useState(today);
  const first=m.getDay(),dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const cells=[];for(let i=0;i<first;i++)cells.push(h('div',{key:'e'+i,style:{visibility:'hidden'}}));
  for(let d=1;d<=dim;d++){const k=m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(d),s=stat(tasks,k);
    cells.push(h('div',{key:k,className:(k===sel?'sel ':'')+(k===today?'td':''),style:{background:s.n?`rgba(39,224,138,${0.08+s.p/100*0.5})`:undefined,borderColor:s.n&&s.p<100&&k<today?'#ff4d6d99':undefined},onClick:()=>setSel(k)},d));}
  const mv=n=>setM(x=>new Date(x.getFullYear(),x.getMonth()+n,1));
  const l=forDay(tasks,sel),st=stat(tasks,sel);
  return h('div',null,
    h('div',{className:'hd'},h('button',{className:'btn g',onClick:()=>mv(-1)},'‹'),h('b',null,m.toLocaleString('en',{month:'long',year:'numeric'})),h('button',{className:'btn g',onClick:()=>mv(1)},'›')),
    h('div',{className:'cal'},['S','M','T','W','T','F','S'].map((x,i)=>h('div',{key:i,className:'h'},x)),cells),
    h('h3',null,sel+(st.n?' · '+st.p+'% done':'')),
    l.length?l.map(t=>h(Row,{key:t.id,t,k:sel,toggle,edit,miss:sel<today})):h('div',{className:'empty'},'No tasks on this day'),
    sel>=NS.from&&sel<today&&!hasNote(sel)&&h('div',{className:'meta',style:{color:'var(--er)'}},'Daily note missing'),
    (NS.notes[sel]||[]).map(n=>h('div',{key:n.id,className:'row'},h('div',{className:'grow',style:{cursor:'default'}},h('div',{className:'ti',style:{whiteSpace:'pre-wrap',fontWeight:400}},n.text),h('div',{className:'meta'},(n.cat?'# '+n.cat+' · ':'')+n.at)))));
}

function App(){
  const [d,_setD]=useState(()=>{const x=Store.load()||{v:1,user:null,tasks:[],goals:[]};if(!x.notes)x.notes={};if(!x.ncats)x.ncats=[];if(!x.notesFrom)x.notesFrom=dk(new Date());return x});
  const setD=_setD;
  const [tab,setTab]=useState('today'),[m,setM]=useState(null);
  useEffect(()=>{Store.save(d)},[d]);
  const today=dk(new Date());
  NS.notes=d.notes||{};NS.from=d.notesFrom||'9999-99-99';
  const setTasks=f=>setD(x=>({...x,tasks:f(x.tasks)}));
  const setGoals=f=>setD(x=>({...x,goals:f(x.goals)}));
  const toggle=(id,k)=>setTasks(a=>a.map(t=>t.id===id?{...t,done:{...t.done,[k]:!t.done[k]}}:t));
  const add=t=>setTasks(a=>[...a,t]);
  const save=t=>{setTasks(a=>a.some(x=>x.id===t.id)?a.map(x=>x.id===t.id?t:x):[...a,t]);setM(null)};
  const del=id=>setTasks(a=>a.filter(t=>t.id!==id));
  const blank=()=>({id:uid(),title:'',cat:'Personal',pri:'Medium',rep:'once',date:today,done:{}});
  const edit=t=>setM({t,isNew:false});
  const P={tasks:d.tasks,today,toggle,edit,del,add};
  const tabs=[['today','◉','TODAY'],['tasks','☰','TASKS'],['goals','◎','GOALS'],['notes','✎','NOTES'],['stats','▤','STATS'],['cal','▦','CAL']];
  return h('div',null,
    h('div',{className:'hd'},h('h1',null,'MY TASKS'),h('span',{className:'sub'},pd(today).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'}))),
    tab==='today'&&h(Today,P),tab==='tasks'&&h(Tasks,P),tab==='goals'&&h(Goals,{goals:d.goals,setGoals}),tab==='notes'&&h(Notes,{d,setD,today}),tab==='stats'&&h(Stats,P),tab==='stats'&&h(Report,P),tab==='cal'&&h(Calendar,P),
    tab!=='goals'&&tab!=='notes'&&h('button',{className:'fab',onClick:()=>setM({t:blank(),isNew:true}),'aria-label':'Add task'},'+'),
    h('div',{className:'nav'},tabs.map(x=>h('button',{key:x[0],className:tab===x[0]?'on':'',onClick:()=>setTab(x[0])},h('b',null,x[1]),x[2]))),
    m&&h(Modal,{t:m.t,isNew:m.isNew,onSave:save,onClose:()=>setM(null),onDelete:()=>{del(m.t.id);setM(null)}}));
}
ReactDOM.createRoot(document.getElementById('r')).render(h(App));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
